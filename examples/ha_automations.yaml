# 示例 1：每天 03:00 校时
# entity_id 以 HA 实际生成的为准，可在“开发者工具 → 实体”里搜索“立即校时”。
alias: 九牧柜体每日校时
description: 每天凌晨通过 ESPHome 蓝牙代理给柜体校时
triggers:
  - trigger: time
    at: "03:00:00"
actions:
  - action: button.press
    target:
      entity_id: button.jiumu_cabinet_sync_now
mode: single

---
# 示例 2：HA 启动后 5 分钟补一次（设备/代理重启后时间可能漂移）
alias: 九牧柜体启动后校时
description: HA 启动后等待蓝牙代理就绪，再补一次校时
triggers:
  - trigger: homeassistant
    event: start
actions:
  - delay: "00:05:00"
  - action: button.press
    target:
      entity_id: button.jiumu_cabinet_sync_now
mode: single

---
# 示例 3：调试用——按地址直接调用服务并读取返回值
# 正式自动化不建议写死 MAC；这里仅用于首次验证/抓日志。
alias: 九牧调试校时
description: 直接调用 sync_time 并查看返回的 payload/notify
triggers:
  - trigger: time
    at: "12:00:00"
actions:
  - action: jiumu_ble_sync.sync_time
    data:
      address: "AA:BB:CC:DD:EE:FF"
      model: auto
      wait_notify: true
    response_variable: sync_result
  - action: logbook.log
    data:
      name: jiumu_ble_sync
      message: "{{ sync_result }}"
mode: single
